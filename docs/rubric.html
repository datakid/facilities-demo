<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubric — weighted ranking workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23faf8f5'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23221f2b'/%3E%3Crect x='10' y='12' width='4' height='10' fill='%23faf8f5'/%3E%3Crect x='15' y='15' width='4' height='7' fill='%23faf8f5'/%3E%3Crect x='20' y='18' width='4' height='4' fill='%23faf8f5'/%3E%3C/svg%3E">
<meta name="theme-color" content="#6b5596">
<style>
:root{
--paper:#faf8f5;--paper-2:#f3efe9;--surface:rgba(255,255,255,.72);
--ink:#221f2b;--ink-mu:#6a6478;--ink-fa:#9a93a6;
--line:rgba(34,31,43,.10);--line-2:rgba(34,31,43,.18);
--accent:#6b5596;--accent-soft:rgba(107,85,150,.12);--focus:#8a6fc0;
--ok:#4e8f6d;--warn:#b08034;--bad:#b05a52;
--c1:#6d8cb0;--c2:#8d79ad;--c3:#7fa08a;--c4:#c08a6a;--c5:#6f9aa3;--c6:#a8829b;--c7:#9a9367;--c8:#7b8fa8;
--serif:Fraunces,'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
--mono:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
--r1:14px;--r2:20px;--r3:28px;
}
[data-theme="dark"]{
--paper:#17151c;--paper-2:#1e1b24;--surface:rgba(255,255,255,.06);
--ink:#f1eef6;--ink-mu:#b6afc6;--ink-fa:#847d94;
--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.16);
--accent:#a58bd6;--accent-soft:rgba(165,139,214,.16);--focus:#c3aef0;
--ok:#6db38c;--warn:#d3a15c;--bad:#d18178;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:var(--serif)}
.mono,input,select,td,.num{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden,[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;
background:var(--surface);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
[data-theme="dark"] header{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600}
.brand span{color:var(--ink-fa);font-size:11.5px}
nav.tabs{display:flex;gap:2px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs button{border:none;background:none;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-mu)}
nav.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;color:var(--ink-mu)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-fa)}
.iconbtn:disabled{opacity:.35;cursor:default}
select.hdr{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:12px}
#testBadge{font-family:var(--mono);font-size:11px;color:var(--ink-fa);padding:4px 8px}
#testBadge:empty{display:none}

main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
.view h1{font-size:22px;margin:0 0 2px}
.viewsub{color:var(--ink-mu);font-size:12.5px;margin:0 0 20px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--ink-fa)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.4;cursor:default}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1)}
table.grid{border-collapse:collapse;width:100%;background:var(--paper)}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;white-space:nowrap}
table.grid th{background:var(--paper-2);text-align:left;font-size:11px;color:var(--ink-mu);font-weight:700;padding:8px 10px;position:sticky;top:0}
table.grid td.lbl,table.grid th.lbl{position:sticky;left:0;background:var(--paper-2);z-index:2;min-width:160px}
table.grid td{font-family:var(--mono);font-size:12.5px;text-align:right;min-width:90px}
table.grid td.lbl{text-align:left;font-family:var(--sans)}
table.grid .cellbox{padding:7px 10px;outline:none}
table.grid .cellbox.missing{color:var(--ink-fa);font-style:italic}
table.grid td.sel .cellbox{outline:2px solid var(--focus);outline-offset:-2px;border-radius:4px}
table.grid input.cellinput{width:100%;border:none;background:var(--accent-soft);padding:7px 10px;font:inherit;text-align:inherit;outline:2px solid var(--focus)}
table.grid th .colhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
table.grid th .colhead small{color:var(--ink-fa);font-weight:500}
table.grid button.mini{border:none;background:none;color:var(--ink-fa);font-size:13px;padding:0 2px;line-height:1}
table.grid button.mini:hover{color:var(--bad)}

.criteria-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ccard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.ccard .copyglyph{position:absolute;top:12px;right:12px;border:1px solid var(--line-2);background:var(--paper);border-radius:8px;width:26px;height:26px;font-size:12px;color:var(--ink-mu);display:flex;align-items:center;justify-content:center}
.ccard .copyglyph:hover{color:var(--ink);border-color:var(--ink-fa)}
.ccard h3{margin:0 0 8px;padding-right:32px}
.ccard input.field,.ccard select.field,.ccard textarea.field{width:100%;border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:6px 9px;font-size:12.5px;margin:2px 0 8px}
.ccard label.flabel{display:block;font-size:11px;color:var(--ink-mu);font-weight:600;margin-top:6px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.rel{background:var(--accent-soft);color:var(--accent)}
.badge.abs{background:var(--paper-2);color:var(--ink-mu)}
.dirtoggle{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;width:fit-content}
.dirtoggle button{border:none;background:var(--paper);padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--ink-mu)}
.dirtoggle button.on{background:var(--accent);color:#fff}
.paramrow{display:flex;gap:8px}
.paramrow>div{flex:1}
.curveplot{width:100%;height:auto;margin:8px 0}
.curveplot .axis{stroke:var(--line-2);stroke-width:1}
.curveplot .curve{stroke:var(--accent);stroke-width:2;fill:none}
.curveplot .dot{fill:var(--ink-mu);opacity:.6}
.curveplot .bar{fill:var(--accent-soft);stroke:var(--accent)}
.weightreadout{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.weightreadout b{font-family:var(--mono);font-size:16px}

.modalbg{position:fixed;inset:0;z-index:70;background:rgba(20,17,26,.4);display:flex;align-items:center;justify-content:center;padding:20px}
[data-theme="dark"] .modalbg{background:rgba(0,0,0,.6)}
.modal{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r2);padding:20px;max-width:640px;width:100%;max-height:82vh;overflow:auto;
backdrop-filter:blur(18px) saturate(1.15);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal table{width:100%;border-collapse:collapse;margin:12px 0}
.modal th,.modal td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.modal .mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);
border-radius:999px;padding:10px 20px;font-size:12.5px;font-weight:600;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
[data-theme="dark"] .toast{background:var(--paper-2);color:var(--ink);border:1px solid var(--line-2)}
.toast[hidden]{display:none}

.tooltip{position:fixed;z-index:75;pointer-events:none;background:var(--surface);backdrop-filter:blur(18px);border:1px solid var(--line-2);
border-radius:10px;padding:6px 10px;font-size:11.5px;box-shadow:0 12px 30px -14px rgba(0,0,0,.5)}
.tooltip[hidden]{display:none}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border:1px solid var(--line-2);
border-radius:var(--r1);padding:10px 14px;font-size:12.5px;margin-bottom:16px}
.banner button{border:none;background:none;color:var(--ink-mu);font-size:16px;line-height:1}

.methodtabs{display:flex;gap:2px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px;width:fit-content;margin-bottom:14px}
.methodtabs button{border:none;background:none;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-mu)}
.methodtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wsummary{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.weightbar{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.weightbar span{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.deltalist{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.deltalist .dchip{font-family:var(--mono);font-size:11.5px;background:var(--paper-2);border-radius:8px;padding:5px 9px}
.deltalist .dchip b{color:var(--ink)}
.presetlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.presetrow{display:flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:8px;padding:6px 10px;font-size:12.5px}
.presetrow .presetname{flex:1;font-weight:600}
.directrow{display:grid;grid-template-columns:140px 1fr 60px 70px 60px;align-items:center;gap:10px;padding:6px 0}
.directrow input[type="range"]{width:100%}
.directrow input[type="number"]{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:4px 6px}
.rocrow{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--paper-2);border-radius:8px;margin-bottom:6px}
.rocrow .rocw{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-mu)}
.ahppair{text-align:center;padding:20px 0}
.ahppair .pairnames{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:10px}
.ahppair input[type="range"]{width:100%}
.ahpnav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ahpresult{margin-top:16px;padding:14px;border-radius:10px;background:var(--paper-2)}
.ahpresult.cr-bad{background:rgba(176,90,82,.12)}
.ranklist{display:flex;flex-direction:column;gap:8px}
.rankrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:10px 14px}
.rankrow .rankhead{display:flex;align-items:center;gap:12px;cursor:pointer}
.rankrow .rn{font-family:var(--mono);font-size:15px;color:var(--ink-mu);width:22px}
.rankrow .rl{flex:1;font-weight:700}
.rankrow .rt{font-family:var(--mono);font-size:15px}
.contribbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.rankbreakdown{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.rankbreakdown table{width:100%;border-collapse:collapse}
.rankbreakdown td,.rankbreakdown th{padding:4px 6px;text-align:right;font-family:var(--mono);font-size:11.5px}
.rankbreakdown td:first-child,.rankbreakdown th:first-child{text-align:left;font-family:var(--sans)}
.h2h{margin:16px 0;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r1)}
.h2h .h2hrow{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.exsection{margin-top:20px}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);padding:10px 14px;margin-bottom:6px;font-size:12.5px}
.notesfoot{margin-top:20px;padding:14px;background:var(--paper-2);border-radius:var(--r1);font-size:12px;color:var(--ink-mu)}
.notesfoot li{margin-bottom:4px}
.pinbtn{border:1px solid var(--line-2);background:var(--paper);border-radius:6px;font-size:10.5px;padding:3px 8px;font-weight:700}
.pinbtn.on{background:var(--accent);color:#fff;border-color:transparent}

@media print{
header,nav.tabs,.toolbar,.iconbtn,.skiplink,.toast,#modalRoot,.tooltip,.copyglyph,.pinbtn{display:none!important}
main{max-width:none;padding:0}
:root{--paper:#fff;--ink:#111;--ink-mu:#444;--line:#ccc;--surface:#fff}
body{background:#fff;color:#111}
.panel{border-color:#ccc;background:#fff}
a{color:#111;text-decoration:underline}
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cellbox:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:4px}
.skiplink{position:fixed;left:-999px;top:8px;z-index:100;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700}
.skiplink:focus{left:8px}

@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a href="#main" class="skiplink">Skip to content</a>

<header>
<div class="brand"><b>Rubric</b><span>weighted ranking workbench</span></div>
<nav class="tabs" id="tabs">
<button data-view="data" class="on">Data</button>
<button data-view="criteria">Criteria</button>
<button data-view="weights">Weights</button>
<button data-view="rank">Rank</button>
<button data-view="stress">Stress</button>
<button data-view="record">Record</button>
</nav>
<select class="hdr" id="exampleSel">
<option value="">Load example\u2026</option>
</select>
<button class="iconbtn" id="undoBtn" title="Undo">Undo</button>
<button class="iconbtn" id="redoBtn" title="Redo">Redo</button>
<button class="iconbtn" id="themeBtn" title="Toggle dark theme">Dark</button>
<span id="testBadge"></span>
</header>

<main id="main">
<div id="banner"></div>
<section class="view" id="v-data" hidden></section>
<section class="view" id="v-criteria" hidden></section>
<section class="view" id="v-weights" hidden></section>
<section class="view" id="v-rank" hidden></section>
<section class="view" id="v-stress" hidden></section>
<section class="view" id="v-record" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="tooltip" id="tooltip" hidden></div>
<div id="modalRoot"></div>

<script>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=a=>a.reduce((x,y)=>x+y,0);
function fmt(n,decimals=1,unit=''){
if(n===null||n===undefined||Number.isNaN(n))return '\u2014';
const s=Number(n).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
return unit?s+' '+unit:s;
}
let _uidN=0;
function uid(prefix='id'){_uidN+=1;return prefix+'_'+Date.now().toString(36)+'_'+_uidN.toString(36);}
function deepClone(o){return typeof structuredClone==='function'?structuredClone(o):JSON.parse(JSON.stringify(o));}
function download(filename,text,mime='text/plain'){
const blob=new Blob([text],{type:mime});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
URL.revokeObjectURL(url);
}
function copyText(text){
const fallback=()=>new Promise((resolve,reject)=>{
const ta=document.createElement('textarea');
ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();
try{document.execCommand('copy');resolve()}catch(e){reject(e)}
ta.remove();
});
if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).catch(fallback);
return fallback();
}
let _toastTimer=0;
function toast(msg,ms=2000){
const el=$('#toast');
if(!el)return;
el.textContent=msg;
el.hidden=false;
clearTimeout(_toastTimer);
_toastTimer=setTimeout(()=>{el.hidden=true},ms);
}


const NORMALIZERS={
linear:{
id:'linear',label:'Linear',blurb:'Scales between the lowest and highest value in the current option set.',
params:[],needs:'numeric',
fn(x,p,stats){
if(stats.max===stats.min)return{v:0.5,flag:'No variation across options for this criterion.'};
return{v:clamp((x-stats.min)/(stats.max-stats.min),0,1),flag:null};
},
inverse(v,p,stats){if(stats.max===stats.min)return null;return stats.min+v*(stats.max-stats.min);},
latex(p,stats){return`\\frac{x - ${stats.min}}{${stats.max} - ${stats.min}}`;},
plain(p,stats){return`(x \u2212 ${stats.min}) / (${stats.max} \u2212 ${stats.min})`;},
sheet(p,stats,ref){return`=(${ref}-${stats.min})/(${stats.max}-${stats.min})`;}
},
'fixed-linear':{
id:'fixed-linear',label:'Fixed range',blurb:'Scales between two bounds you set, regardless of the current option set.',
params:[{key:'lo',label:'Low bound',type:'number',default:0},{key:'hi',label:'High bound',type:'number',default:1}],
needs:'numeric',
fn(x,p){
const raw=(x-p.lo)/(p.hi-p.lo);
const v=clamp(raw,0,1);
return{v,flag:(raw<0||raw>1)?'Clamped to the fixed range.':null};
},
inverse(v,p){return p.lo+v*(p.hi-p.lo);},
latex(p){return`\\mathrm{clamp}\\left(\\frac{x - ${p.lo}}{${p.hi} - ${p.lo}}, 0, 1\\right)`;},
plain(p){return`clamp((x \u2212 ${p.lo}) / (${p.hi} \u2212 ${p.lo}), 0, 1)`;},
sheet(p,stats,ref){return`=MIN(1,MAX(0,(${ref}-${p.lo})/(${p.hi}-${p.lo})))`;}
},
decay:{
id:'decay',label:'Decay',blurb:'Falls off smoothly from 1, halving every stated half-life.',
params:[{key:'halfLife',label:'Half-life',type:'number',default:10}],
needs:'numeric',
fn(x,p){const lambda=p.halfLife/Math.LN2;return{v:Math.exp(-x/lambda),flag:null};},
inverse(v,p){if(v<=0||v>1)return null;const lambda=p.halfLife/Math.LN2;return -lambda*Math.log(v);},
latex(p){return`e^{-x / \\lambda},\\ \\lambda = \\frac{${p.halfLife}}{\\ln 2}`;},
plain(p){return`e^(\u2212x / \u03bb), \u03bb = half-life \u00f7 ln 2 = ${(p.halfLife/Math.LN2).toFixed(2)}`;},
sheet(p,stats,ref){return`=EXP(-${ref}/${(p.halfLife/Math.LN2).toFixed(4)})`;}
},
logistic:{
id:'logistic',label:'Logistic',blurb:'S-curve centred on a midpoint, controlled by a 10\u201390% width.',
params:[{key:'midpoint',label:'Midpoint',type:'number',default:0},{key:'width',label:'10\u201390% width',type:'number',default:1}],
needs:'numeric',
fn(x,p){const k=Math.log(81)/p.width;return{v:1/(1+Math.exp(-k*(x-p.midpoint))),flag:null};},
inverse(v,p){if(v<=0||v>=1)return null;const k=Math.log(81)/p.width;return p.midpoint-Math.log(1/v-1)/k;},
latex(p){return`\\frac{1}{1+e^{-k(x-${p.midpoint})}},\\ k=\\frac{\\ln 81}{${p.width}}`;},
plain(p){return`1 / (1 + e^(\u2212k(x \u2212 ${p.midpoint}))), k = ln81 \u00f7 ${p.width}`;},
sheet(p,stats,ref){const k=(Math.log(81)/p.width).toFixed(6);return`=1/(1+EXP(-${k}*(${ref}-${p.midpoint})))`;}
},
'target-band':{
id:'target-band',label:'Target band',blurb:'Full points at an ideal value, falling off linearly within a tolerance.',
params:[{key:'ideal',label:'Ideal value',type:'number',default:0},{key:'tol',label:'Tolerance',type:'number',default:1}],
needs:'numeric',
fn(x,p){return{v:1-Math.min(1,Math.abs(x-p.ideal)/p.tol),flag:null};},
inverse(){return null;},
latex(p){return`1 - \\min\\left(1, \\frac{|x-${p.ideal}|}{${p.tol}}\\right)`;},
plain(p){return`1 \u2212 min(1, |x \u2212 ${p.ideal}| / ${p.tol})`;},
sheet(p,stats,ref){return`=1-MIN(1,ABS(${ref}-${p.ideal})/${p.tol})`;}
},
'target-soft':{
id:'target-soft',label:'Target (soft)',blurb:'Bell curve peaking at an ideal value, width set by sigma.',
params:[{key:'ideal',label:'Ideal value',type:'number',default:0},{key:'sigma',label:'Sigma',type:'number',default:1}],
needs:'numeric',
fn(x,p){return{v:Math.exp(-Math.pow((x-p.ideal)/p.sigma,2)),flag:null};},
inverse(){return null;},
latex(p){return`e^{-\\left(\\frac{x-${p.ideal}}{${p.sigma}}\\right)^2}`;},
plain(p){return`e^(\u2212((x \u2212 ${p.ideal}) / ${p.sigma})\u00b2)`;},
sheet(p,stats,ref){return`=EXP(-(((${ref}-${p.ideal})/${p.sigma})^2))`;}
},
step:{
id:'step',label:'Step',blurb:'Piecewise-constant value that changes at your breakpoints.',
params:[{key:'breakpoints',label:'Breakpoints',type:'breakpoints',default:[]}],
needs:'numeric',
fn(x,p){
const bps=[...(p.breakpoints||[])].sort((a,b)=>a.at-b.at);
let v=bps.length?bps[0].v:0;
for(const b of bps){if(x>=b.at)v=b.v;else break;}
return{v:clamp(v,0,1),flag:null};
},
inverse(){return null;},
latex(p){return`\\text{piecewise constant over }${(p.breakpoints||[]).length}\\text{ breakpoints}`;},
plain(){return`piecewise constant over user breakpoints`;},
sheet(p,stats,ref){
const bps=[...(p.breakpoints||[])].sort((a,b)=>a.at-b.at);
return`=LOOKUP(${ref},{${bps.map(b=>b.at).join(',')}},{${bps.map(b=>b.v).join(',')}})`;
}
},
'log-linear':{
id:'log-linear',label:'Log-linear',blurb:'Linear on a log scale between the lowest and highest value.',
params:[],needs:'numeric',
fn(x,p,stats){
if(x<=0)throw new Error('log-linear requires x > 0');
if(stats.min<=0)throw new Error('log-linear requires all values > 0');
if(stats.max===stats.min)return{v:0.5,flag:'No variation across options for this criterion.'};
return{v:(Math.log(x)-Math.log(stats.min))/(Math.log(stats.max)-Math.log(stats.min)),flag:null};
},
inverse(v,p,stats){if(stats.max===stats.min)return null;return Math.exp(Math.log(stats.min)+v*(Math.log(stats.max)-Math.log(stats.min)));},
latex(p,stats){return`\\frac{\\ln x - \\ln ${stats.min}}{\\ln ${stats.max} - \\ln ${stats.min}}`;},
plain(p,stats){return`(ln x \u2212 ln ${stats.min}) / (ln ${stats.max} \u2212 ln ${stats.min})`;},
sheet(p,stats,ref){return`=(LN(${ref})-LN(${stats.min}))/(LN(${stats.max})-LN(${stats.min}))`;}
},
percentile:{
id:'percentile',label:'Percentile',blurb:'Rank among the current options, 0 for lowest, 1 for highest, tied ranks averaged.',
params:[],needs:'numeric',
fn(x,p,stats){
const vals=stats.values,n=vals.length;
if(n<=1)return{v:0.5,flag:'No variation across options for this criterion.'};
const sorted=[...vals].sort((a,b)=>a-b);
let sumRank=0,count=0;
sorted.forEach((v,i)=>{if(v===x){sumRank+=(i+1);count++;}});
const avgRank=sumRank/count;
return{v:(avgRank-1)/(n-1),flag:null};
},
inverse(){return null;},
latex(){return`\\frac{\\mathrm{rank}(x) - 1}{n - 1}`;},
plain(){return`(rank \u2212 1) / (n \u2212 1), average rank for ties`;},
sheet(p,stats,ref){return`=(RANK.AVG(${ref},$criterion_range,1)-1)/(${Math.max(1,stats.values.length-1)})`;}
},
categorical:{
id:'categorical',label:'Categorical',blurb:'An explicit points value for each named category.',
params:[{key:'map',label:'Category map',type:'map',default:{}}],
needs:'categorical',
fn(x,p){
if(Object.prototype.hasOwnProperty.call(p.map||{},x))return{v:p.map[x],flag:null};
return{v:null,flag:'Unmapped category value.'};
},
inverse(v,p){

return null;
},
latex(){return`\\text{map}(x)`;},
plain(){return`explicit category \u2192 value map`;},
sheet(p,stats,ref){return`=VLOOKUP(${ref},category_map_range,2,FALSE)`;}
},
boolean:{
id:'boolean',label:'Boolean',blurb:'True earns full points, false earns none.',
params:[],needs:'boolean',
fn(x){

return{v:null,flag:'Boolean value expected.'};
},
inverse(v){return v>=0.5;},
latex(){return`[x]`;},

function isMissingVal(v){
return v===null||v===''||v===undefined||(typeof v==='number'&&Number.isNaN(v));
}
function evalCondition(cond,option){
switch(cond.t){
case'all':return cond.of.every(c=>evalCondition(c,option));
case'any':return cond.of.some(c=>evalCondition(c,option));
case'not':return!evalCondition(cond.of[0],option);
case'cmp':{
const v=option.values[cond.criterion];
switch(cond.op){
case'<':return v<cond.value;
case'<=':return v<=cond.value;
case'>':return v>cond.value;
case'>=':return v>=cond.value;
case'==':return v===cond.value;
case'!=':return v!==cond.value;
default:return false;
}
}
case'between':{const v=option.values[cond.criterion];return v>=cond.lo&&v<=cond.hi;}
case'in':{const v=option.values[cond.criterion];return cond.values.includes(v);}
case'tag':return(option.tags||[]).includes(cond.value);
case'missing':{const v=option.values[cond.criterion];return isMissingVal(v);}
default:return false;
}
}

const ENGINE={
score(model){
const notes=[];
const imputations=[];

const stats={};
model.criteria.forEach(cr=>{
const vals=model.options.map(o=>o.values[cr.id]).filter(v=>!isMissingVal(v));
const numericVals=vals.filter(v=>typeof v==='number');
stats[cr.id]={
min:numericVals.length?Math.min(...numericVals):undefined,
max:numericVals.length?Math.max(...numericVals):undefined,
mean:numericVals.length?sum(numericVals)/numericVals.length:undefined,
n:vals.length,
values:vals
};
});

const excludeOptionIds=new Set();
const incomplete=[];
const normValues={};

model.options.forEach(opt=>{
normValues[opt.id]={};
const missingCrits=[];
model.criteria.forEach(cr=>{
const raw=opt.values[cr.id];
let missing=isMissingVal(raw);
const norm=NORMALIZERS[cr.scale.kind];
let v=null,flag=null;
if(!missing){
try{
const r=norm.fn(raw,cr.scale.params||{},stats[cr.id]);
v=r.v;flag=r.flag;
if(v===null)missing=true;
}catch(e){
missing=true;
flag=e.message;
}
}
if(missing){
missingCrits.push(cr.id);
const policy=cr.missing;
if(policy==='worst'){v=0;imputations.push({optionId:opt.id,criterionId:cr.id,policy,valueUsed:0});}
else if(policy==='neutral'){v=0.5;imputations.push({optionId:opt.id,criterionId:cr.id,policy,valueUsed:0.5});}
else if(policy==='best'){v=1;imputations.push({optionId:opt.id,criterionId:cr.id,policy,valueUsed:1});}
else if(policy==='redistribute'){v=null;imputations.push({optionId:opt.id,criterionId:cr.id,policy,valueUsed:null});}
else{v=null;imputations.push({optionId:opt.id,criterionId:cr.id,policy:'exclude-option',valueUsed:null});}
}else{
if(flag)notes.push(`${cr.label}: ${flag} (${opt.label})`);
if(cr.direction==='min'&&cr.scale.kind!=='decay'&&cr.scale.kind!=='target-band'){
v=1-v;
}
}
normValues[opt.id][cr.id]=v;
});
const excludeHit=missingCrits.some(cid=>{
const cr=model.criteria.find(c=>c.id===cid);
return cr&&cr.missing==='exclude-option';
});
if(excludeHit){
excludeOptionIds.add(opt.id);
incomplete.push({option:opt,missing:missingCrits});
}
});

const excluded=[];
const softPenalties={};
const gatedOptionIds=new Set();
model.options.forEach(opt=>{
if(excludeOptionIds.has(opt.id))return;
for(const g of model.gates){
const pass=evalCondition(g.when,opt);
if(!pass){
if(g.severity==='hard'){
excluded.push({option:opt,gate:g.label,message:g.message});
gatedOptionIds.add(opt.id);
break;
}else{
softPenalties[opt.id]=(softPenalties[opt.id]||0)+(g.penalty||0);
}
}
}
});

const rankable=model.options.filter(o=>!excludeOptionIds.has(o.id)&&!gatedOptionIds.has(o.id));
const weightSum=sum(model.criteria.map(c=>c.weight))||1;

const scored=rankable.map(opt=>{
const critList=model.criteria;
const nullCrits=critList.filter(c=>normValues[opt.id][c.id]===null);
const weights={};
if(nullCrits.length){
const remaining=critList.filter(c=>normValues[opt.id][c.id]!==null);
const remSum=sum(remaining.map(c=>c.weight))||1;
remaining.forEach(c=>{weights[c.id]=c.weight/remSum*100;});
nullCrits.forEach(c=>{weights[c.id]=0;});
notes.push(`${opt.label}: weights redistributed over ${remaining.length} of ${critList.length} criteria; score not directly comparable.`);
}else{
critList.forEach(c=>{weights[c.id]=c.weight/weightSum*100;});
}

const wFrac={};critList.forEach(c=>{wFrac[c.id]=weights[c.id]/100;});
const contributions={};
let total;
const p=model.aggregate.kind==='topsis'?1:model.aggregate.p;

if(p===0){
let prod=1;
critList.forEach(c=>{
const v=normValues[opt.id][c.id];
if(v===null){contributions[c.id]={v:null,weighted:0,pctOfTotal:0};return;}
const vv=Math.max(v,0.001);
prod*=Math.pow(vv,wFrac[c.id]);
contributions[c.id]={v,weighted:wFrac[c.id]*vv,pctOfTotal:0};
});
total=prod;
}else{
let floored=false,s=0;
critList.forEach(c=>{
const v=normValues[opt.id][c.id];
if(v===null){contributions[c.id]={v:null,weighted:0,pctOfTotal:0};return;}
let vv=v;
if(p<0&&vv<0.001){vv=0.001;floored=true;}
const term=wFrac[c.id]*Math.pow(vv,p);
s+=term;
contributions[c.id]={v,weighted:wFrac[c.id]*vv,pctOfTotal:0};
});
if(floored)notes.push('values floored at 0.001 for p \u2264 0');
total=Math.pow(s,1/p);
}

const penalty=softPenalties[opt.id]||0;
const totalPts=clamp(total*100-penalty,0,100);
const wsum=sum(Object.values(contributions).map(c=>c.weighted))||1;
Object.values(contributions).forEach(c=>{c.pctOfTotal=totalPts?c.weighted/wsum*100:0;});

return{option:opt,total:totalPts,rank:0,tied:false,contributions,
penalties:penalty?[{gate:'soft gate(s)',points:penalty}]:[],softNotes:[]};
});

if(model.aggregate.kind==='topsis'){
const crit=model.criteria;
const y={};
rankable.forEach(opt=>{
y[opt.id]={};
crit.forEach(c=>{
const v=normValues[opt.id][c.id];
y[opt.id][c.id]=(v===null?0:v)*(c.weight/weightSum);
});
});
const ideal={},antiIdeal={};
crit.forEach(c=>{
const colVals=rankable.map(o=>y[o.id][c.id]);
ideal[c.id]=colVals.length?Math.max(...colVals):0;
antiIdeal[c.id]=colVals.length?Math.min(...colVals):0;
});
scored.forEach(s=>{
let dPos=0,dNeg=0;
crit.forEach(c=>{
dPos+=Math.pow(y[s.option.id][c.id]-ideal[c.id],2);
dNeg+=Math.pow(y[s.option.id][c.id]-antiIdeal[c.id],2);
});
dPos=Math.sqrt(dPos);dNeg=Math.sqrt(dNeg);
const C=(dPos+dNeg)?dNeg/(dPos+dNeg):0;
const penalty=softPenalties[s.option.id]||0;
s.total=clamp(C*100-penalty,0,100);
});
}

scored.sort((a,b)=>b.total-a.total);
let rank=0,prevTotal=null;
scored.forEach((s,i)=>{
if(prevTotal===null||Math.abs(s.total-prevTotal)>1e-9){rank=i+1;}
else{s.tied=true;scored[i-1].tied=true;}
s.rank=rank;
prevTotal=s.total;
});
if(model.aggregate.tiebreak&&model.aggregate.tiebreak.length){
const groups={};
scored.forEach(s=>{(groups[s.rank]=groups[s.rank]||[]).push(s);});
Object.values(groups).forEach(g=>{
if(g.length>1){
g.sort((a,b)=>{
for(const cid of model.aggregate.tiebreak){
const av=normValues[a.option.id][cid]||0,bv=normValues[b.option.id][cid]||0;
if(av!==bv)return bv-av;
}
return 0;
});
notes.push(`Tie among ${g.map(x=>x.option.label).join(', ')} broken by ${model.aggregate.tiebreak.join(', ')}.`);
}
});
}

const winner=scored[0]||null;
const runnerUp=scored[1]||null;
const margin=winner&&runnerUp?winner.total-runnerUp.total:null;
let decisiveCriterion=null;
if(winner&&runnerUp){
let best=null,bv=-Infinity;
model.criteria.forEach(c=>{
const wc=winner.contributions[c.id],rc=runnerUp.contributions[c.id];
const dv=(wc&&wc.v!==null?wc.pctOfTotal:0)-(rc&&rc.v!==null?rc.pctOfTotal:0);
if(dv>bv){bv=dv;best=c;}
});
decisiveCriterion=best;
}

return{
ranked:scored,excluded,incomplete,imputations,
stats:{perCriterion:stats},notes,
winner:winner?winner.option:null,
runnerUp:runnerUp?runnerUp.option:null,
margin,decisiveCriterion,
marginPct:(winner&&runnerUp&&winner.total)?(margin/winner.total*100):null
};
}
};


const WEIGHTS={
applyDirect(criteria,id,value){
const target=criteria.find(c=>c.id===id);
if(!target)return{ok:false,reason:'Unknown criterion.'};
if(target.locked)return{ok:false,reason:'This weight is locked.'};
value=clamp(Math.round(value),0,100);
const lockedSum=sum(criteria.filter(c=>c.locked).map(c=>c.weight));
const others=criteria.filter(c=>c.id!==id&&!c.locked);
const remaining=100-lockedSum-value;
const weights={};
weights[id]=value;
criteria.filter(c=>c.locked).forEach(c=>{weights[c.id]=c.weight;});
if(remaining<-1e-9)return{ok:false,reason:'Locked weights plus this value exceed 100 points.'};
if(!others.length){
if(Math.abs(remaining)>0.5)return{ok:false,reason:'No unlocked criteria left to absorb the remaining '+Math.round(remaining)+' points.'};
return{ok:true,weights};
}
const otherSum=sum(others.map(c=>c.weight));
others.forEach(c=>{
weights[c.id]=otherSum>0?Math.round(remaining*c.weight/otherSum*100)/100:Math.round(remaining/others.length*100)/100;
});
return{ok:true,weights};
},
equal(criteria){
const n=criteria.length,weights={};
if(!n)return weights;
const base=Math.floor(100/n*100)/100;
let assigned=0;
criteria.forEach((c,i)=>{
if(i<n-1){weights[c.id]=base;assigned+=base;}
else weights[c.id]=Math.round((100-assigned)*100)/100;
});
return weights;
},
rankOrderCentroid(orderedIds){
const n=orderedIds.length,weights={};
if(!n)return weights;
for(let i=1;i<=n;i++){
let s=0;
for(let k=i;k<=n;k++)s+=1/k;
weights[orderedIds[i-1]]=Math.round((s/n)*10000)/100;
}
return weights;
},
allPairs(ids){
const out=[];
for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)out.push({i,j});
return out;
},
sliderToRatio(s){
s=clamp(Math.round(s),-8,8);
return s>=0?1+s:1/(1-s);
},
ratioToSlider(ratio){
if(ratio>=1)return clamp(Math.round(ratio-1),0,8);
return clamp(Math.round(1-1/ratio),-8,0);
},
eigenvector(matrix){
const n=matrix.length;
let v=new Array(n).fill(1/n);
let iterations=0;
for(let iter=0;iter<100;iter++){
iterations=iter+1;
const nv=matrix.map(row=>sum(row.map((val,j)=>val*v[j])));
const s=sum(nv)||1;
const normalized=nv.map(x=>x/s);
const delta=sum(normalized.map((x,i)=>Math.abs(x-v[i])));
v=normalized;
if(delta<1e-10)break;
}
const Av=matrix.map(row=>sum(row.map((val,j)=>val*v[j])));
const ratios=Av.map((av,i)=>v[i]>1e-12?av/v[i]:0);
const lambdaMax=sum(ratios)/n;
return{vector:v,lambdaMax,iterations};
},
consistency(n,lambdaMax){
const RI=[0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49];
const ri=(n>=1&&n<=10)?RI[n-1]:1.49;
const CI=(lambdaMax-n)/((n-1)||1);
const CR=ri>0?CI/ri:0;
return{CI,CR,RI:ri};
},
pairwiseResult(ids,judgments){
const n=ids.length;
const matrix=Array.from({length:n},()=>new Array(n).fill(1));
judgments.forEach(j=>{matrix[j.i][j.j]=j.ratio;matrix[j.j][j.i]=1/j.ratio;});
const{vector,lambdaMax,iterations}=this.eigenvector(matrix);
const{CI,CR,RI:ri}=this.consistency(n,lambdaMax);
const weights={};
ids.forEach((id,i)=>{weights[id]=Math.round(vector[i]*10000)/100;});
const worst=judgments.map(j=>{
const impliedRatio=vector[j.i]/(vector[j.j]||1e-12);
const deviation=Math.abs(Math.log(j.ratio)-Math.log(Math.max(impliedRatio,1e-12)));
return{i:j.i,j:j.j,idA:ids[j.i],idB:ids[j.j],ratio:j.ratio,impliedRatio,deviation};
}).sort((a,b)=>b.deviation-a.deviation).slice(0,3);
return{weights,lambdaMax,CI,CR,RI:ri,iterations,worst,n};
}
};


function mulberry32(seed){
let a=seed>>>0;
return function(){
a|=0;a=a+0x6D2B79F5|0;
let t=Math.imul(a^a>>>15,1|a);
t=t+Math.imul(t^t>>>7,61|t)^t;
return((t^t>>>14)>>>0)/4294967296;
};
}
function randNormal(rng){
let u=0,v=0;
while(u===0)u=rng();
while(v===0)v=rng();
return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function contribV(result,optId,critId){
const entry=result.ranked.find(s=>s.option.id===optId);
if(!entry)return null;
const c=entry.contributions[critId];
return c&&c.v!==null?c.v:0;
}
function flipThresholdExact(model,result,critId,optA,optB){
const base={};model.criteria.forEach(c=>{base[c.id]=c.weight;});
const w0=base[critId];
const S0=100-w0;
const vA=contribV(result,optA,critId),vB=contribV(result,optB,critId);
const dv=vA-vB;
const others=model.criteria.filter(c=>c.id!==critId);
let RA=0,RB=0,scaleBase=S0,redistributedEqually=false;
if(S0<=1e-9){
redistributedEqually=true;
scaleBase=others.length||1;
others.forEach(c=>{RA+=contribV(result,optA,c.id);RB+=contribV(result,optB,c.id);});
}else{
others.forEach(c=>{RA+=base[c.id]*contribV(result,optA,c.id);RB+=base[c.id]*contribV(result,optB,c.id);});
}
const dR=RA-RB;
const denom=scaleBase*dv-dR;
if(Math.abs(denom)<1e-9)return{tStar:null,inRange:false,redistributedEqually,label:'exact'};
const t=-100*dR/denom;
return{tStar:t,inRange:t>=0&&t<=100,redistributedEqually,label:'exact'};
}
function scoreWithCritAt(model,critId,t){
const clone=deepClone(model);
const before={};clone.criteria.forEach(c=>{before[c.id]=c.weight;});
const w0=before[critId];
const S0=100-w0;
const others=clone.criteria.filter(c=>c.id!==critId);
if(S0<=1e-9)others.forEach(c=>{c.weight=(100-t)/(others.length||1);});
else others.forEach(c=>{c.weight=(100-t)*before[c.id]/S0;});
clone.criteria.find(c=>c.id===critId).weight=t;
return ENGINE.score(clone);
}
function flipThresholdNumeric(model,critId,optA,optB){
function diffAt(t){
const r=scoreWithCritAt(model,critId,t);
const a=r.ranked.find(s=>s.option.id===optA),b=r.ranked.find(s=>s.option.id===optB);
return(a?a.total:-1)-(b?b.total:-1);
}
let bracket=null,prev=diffAt(0),prevT=0;
const steps=200;
for(let i=1;i<=steps;i++){
const tt=i*100/steps,cur=diffAt(tt);
if((prev<0&&cur>=0)||(prev>0&&cur<=0)){bracket=[prevT,tt];break;}
prev=cur;prevT=tt;
}
if(!bracket)return{tStar:null,inRange:false,label:'numerical'};
let[a,b]=bracket,fa=diffAt(a);
for(let i=0;i<60;i++){
const mid=(a+b)/2,fm=diffAt(mid);
if(fa*fm<=0)b=mid;else{a=mid;fa=fm;}
}
const t=(a+b)/2;
return{tStar:t,inRange:t>=0&&t<=100,label:'numerical'};
}
function flipThreshold(model,result,critId,optA,optB){
if(model.aggregate.kind==='power-mean'&&model.aggregate.p===1)return flipThresholdExact(model,result,critId,optA,optB);
return flipThresholdNumeric(model,critId,optA,optB);
}
function closestFlip(model,result){
if(!result.winner||result.ranked.length<2)return null;
const winnerId=result.winner.id;
let best=null;
model.criteria.forEach(c=>{
result.ranked.slice(1).forEach(s=>{
const ft=flipThreshold(model,result,c.id,winnerId,s.option.id);
if(ft.tStar!==null&&ft.inRange){
const w0=c.weight,delta=Math.abs(ft.tStar-w0);

function bisectRawForTarget(model,optId,critId,otherId){

const lo=lo0-pad,hi=hi0+pad;

const clone=deepClone(model);

o.values[critId]=x;

const a=r.ranked.find(s=>s.option.id===optId),b=r.ranked.find(s=>s.option.id===otherId);

}

function monteCarlo(model,samples){

if(!active.length)return null;
const stats={};
model.criteria.forEach(c=>{
const vals=model.options.map(o=>o.values[c.id]).filter(v=>typeof v==='number');

clone.criteria.forEach(c=>{

if(!unc||unc.kind==='none')return;
const st=stats[c.id];
const sigma=unc.kind==='abs'?unc.value:(unc.value/100)*((st.max-st.min)||1);

const base=o.values[c.id];
if(typeof base!=='number')return;
o.values[c.id]=clamp(base+randNormal(rng)*sigma,st.min,st.max);

});
const r=ENGINE.score(clone);
const ranked=new Set();
r.ranked.forEach(entry=>{rankLists[entry.option.id].push(entry.rank);ranked.add(entry.option.id);});

model.options.forEach(o=>{

if(!ranks.length){byOption[o.id]={pRank1:0,meanRank:null,p5:null,p95:null,excludedShare:1};return;}
const sorted=[...ranks].sort((a,b)=>a-b);

function weightAgnosticRobustness(model,samples){

const rng=mulberry32(seed);

if(r.winner){wins[r.winner.id]=(wins[r.winner.id]||0)+1;validSamples++;}

function rankReversalCheck(model,result){

model.options.forEach(o=>{
if(o.id===winnerId)return;

clone.options=clone.options.filter(x=>x.id!==o.id);

const STORE=(function(){
let model=null;
const ui={activeView:'data',selection:null,editingCell:null,modal:null};
let past=[],future=[];
const subs=[];
let notifyScheduled=false;
function notify(){
if(notifyScheduled)return;
notifyScheduled=true;
(typeof requestAnimationFrame==='function'?requestAnimationFrame:setTimeout)(()=>{
notifyScheduled=false;
subs.forEach(fn=>fn());
});
}
function act(name,mutator){
const before=model;
const next=deepClone(model);
mutator(next);
past.push({name,model:before});
if(past.length>50)past.shift();
future=[];
model=next;
autosave();
notify();
}
function actUI(mutator){mutator(ui);notify();}
function undo(){
if(!past.length)return;
const entry=past.pop();
future.push({name:entry.name,model});
model=entry.model;
autosave();
notify();
}
function redo(){
if(!future.length)return;
const entry=future.pop();
past.push({name:entry.name,model});
model=entry.model;
autosave();
notify();
}
function subscribe(fn){subs.push(fn);}

let lsOK=true;
try{localStorage.setItem('rubric.probe','1');localStorage.removeItem('rubric.probe');}
catch(e){lsOK=false;}

if(!lsOK)return;
clearTimeout(autosaveTimer);
autosaveTimer=setTimeout(()=>{
try{localStorage.setItem('rubric.autosave',JSON.stringify(model));}
catch(e){lsOK=false;}
},400);
}
function save(){autosave();}
function saveAs(name){

try{localStorage.setItem('rubric.save.'+name,JSON.stringify(model));return true;}
catch(e){return false;}
}
function listSaves(){
if(!lsOK)return[];
const out=[];
try{
for(let i=0;i<localStorage.length;i++){
const k=localStorage.key(i);
if(k&&k.indexOf('rubric.save.')===0)out.push(k.slice('rubric.save.'.length));
}
}catch(e){lsOK=false;}
return out;
}

ui,

function curveDomain(cr,stats){
const p=cr.scale.params||{};
const kind=cr.scale.kind;
if(kind==='linear'||kind==='log-linear'||kind==='percentile'){
const lo=stats.min,hi=stats.max;
if(lo===undefined||hi===undefined||lo===hi)return[0,1];
const pad=(hi-lo)*.08;
return[lo-pad,hi+pad];
}
if(kind==='fixed-linear'){const pad=(p.hi-p.lo)*.15||1;return[p.lo-pad,p.hi+pad];}
if(kind==='decay'){const lambda=p.halfLife/Math.LN2;return[0,lambda*4];}
if(kind==='logistic')return[p.midpoint-p.width*3,p.midpoint+p.width*3];
if(kind==='target-band')return[p.ideal-p.tol*2.5,p.ideal+p.tol*2.5];
if(kind==='target-soft')return[p.ideal-p.sigma*3,p.ideal+p.sigma*3];
if(kind==='step'){
const bps=p.breakpoints||[];
if(!bps.length)return[0,1];
const ats=bps.map(b=>b.at),lo=Math.min(...ats),hi=Math.max(...ats),pad=(hi-lo)*.2||1;
return[lo-pad,hi+pad];
}
return[0,1];
}
function evalDisplay(cr,x,stats){
const norm=NORMALIZERS[cr.scale.kind];
try{
const r=norm.fn(x,cr.scale.params||{},stats);
let v=(typeof r==='object')?r.v:r;
if(v===null)return null;
if(cr.direction==='min'&&cr.scale.kind!=='decay'&&cr.scale.kind!=='target-band')v=1-v;
return v;
}catch(e){return null;}
}
function renderCurvePlot(cr,stats){
const W=300,H=120,PAD=8,BASE=H-PAD-14,SPAN=H-PAD*2-14;
const norm=NORMALIZERS[cr.scale.kind];
if(norm.needs==='boolean'||norm.needs==='categorical'){
let items;
if(norm.needs==='boolean')items=[['False',evalDisplay(cr,false,stats)],['True',evalDisplay(cr,true,stats)]];
else{
const map=(cr.scale.params&&cr.scale.params.map)||{};
items=Object.keys(map).map(k=>[k,evalDisplay(cr,k,stats)]);
}
if(!items.length)return`<svg class="curveplot" viewBox="0 0 ${W} ${H}"></svg>`;
const bw=(W-PAD*2)/items.length;
const bars=items.map(([label,v],i)=>{
const x=PAD+i*bw,bh=(v===null?0:v)*SPAN;
return`<rect class="bar" x="${(x+bw*.15).toFixed(1)}" y="${(BASE-bh).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${bh.toFixed(1)}"></rect><text x="${(x+bw/2).toFixed(1)}" y="${H-2}" font-size="8" fill="var(--ink-fa)" text-anchor="middle">${esc(String(label)).slice(0,10)}</text>`;
}).join('');
return`<svg class="curveplot" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${PAD}" y1="${BASE}" x2="${W-PAD}" y2="${BASE}"></line>${bars}</svg>`;
}
const[lo,hi]=curveDomain(cr,stats);
const N=60;let d='';
for(let i=0;i<=N;i++){
const x=lo+(hi-lo)*i/N,v=evalDisplay(cr,x,stats);
const px=PAD+(W-PAD*2)*i/N,py=BASE-(v===null?0:v)*SPAN;
d+=(i===0?'M':'L')+px.toFixed(1)+' '+py.toFixed(1)+' ';
}
const dots=(stats.values||[]).filter(v=>typeof v==='number').map(rv=>{
const px=PAD+(W-PAD*2)*(rv-lo)/((hi-lo)||1),v=evalDisplay(cr,rv,stats);
const py=BASE-(v===null?0:v)*SPAN;
return`<circle class="dot" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5"></circle>`;
}).join('');
return`<svg class="curveplot" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${PAD}" y1="${BASE}" x2="${W-PAD}" y2="${BASE}"></line><line class="axis" x1="${PAD}" y1="${PAD}" x2="${PAD}" y2="${BASE}"></line><path class="curve" d="${d.trim()}"></path>${dots}</svg>`;
}

</select>
<p class="viewsub" style="margin:-4px 0 8px">${esc(norm.blurb)}</p>

${excluded?`<div class="exsection"><h3>Excluded</h3>${excluded}</div>`:''}
${incomplete?`<div class="exsection"><h3>Incomplete</h3>${incomplete}</div>`:''}
${notes}`;
}
};


function renderMcResults(model,mc){
const assumed=STORE.ui.mcAssumed;
const rows=model.options.map(o=>{
const b=mc.byOption[o.id];
if(!b||b.meanRank===null)return`<div class="h2hrow"><span>${esc(o.label)}</span><span>never ranked</span></div>`;
return`<div class="h2hrow"><span>${esc(o.label)}</span><span>P(rank 1) ${(b.pRank1*100).toFixed(0)}% \u00b7 mean rank ${b.meanRank.toFixed(1)} \u00b7 band ${b.p5}\u2013${b.p95}</span></div>`;
}).join('');
return`<div style="margin-top:10px">${assumed?'<p class="viewsub"><i>Assumed uncertainty, not measured.</i></p>':''}<div class="h2h" style="margin:8px 0 0">${rows}</div></div>`;
}

VIEWS.stress={
render(){
const model=STORE.model;
const result=ENGINE.score(model);
if(!result.winner||result.ranked.length<2){
$('#v-stress').innerHTML='<h1>Stress</h1><p class="viewsub">Needs at least two rankable options to test robustness.</p>';
return;
}
const rr=ANALYSIS.rankReversalCheck(model,result);
const cf=ANALYSIS.closestFlip(model,result);
const winner=result.winner,runnerUp=result.runnerUp;

const flipRows=model.criteria.map(c=>{
const ft=ANALYSIS.flipThreshold(model,result,c.id,winner.id,runnerUp.id);
return'<li>'+esc(ANALYSIS.flipSentence(model,c,runnerUp,ft))+(ft.label==='numerical'?' <i>(numerical)</i>':'')+'</li>';
}).join('');

const tolRows=[];
model.criteria.forEach(c=>{
const tolW=ANALYSIS.inputTolerance(model,winner.id,c.id,runnerUp.id);
tolRows.push('<li>'+esc(ANALYSIS.toleranceSentence(model,winner,c,tolW))+'</li>');
const tolR=ANALYSIS.inputTolerance(model,runnerUp.id,c.id,winner.id);
tolRows.push('<li>'+esc(ANALYSIS.toleranceSentence(model,runnerUp,c,tolR))+'</li>');
});

const robustness=STORE.ui.robustnessResult;
const mc=STORE.ui.monteCarloResult;

$('#v-stress').innerHTML=`
<h1>Stress</h1>
<p class="viewsub">How much the current answer depends on the weights and inputs you chose.</p>
${rr?`<div class="exrow" style="border-color:var(--bad);background:rgba(176,90,82,.1)"><b>Rank reversal</b> \u2014 removing ${esc(rr.flips[0].removed.label)} changes the winner to ${esc(rr.flips[0].newWinner.label)}. This can happen because one or more criteria use relative scoring: switching them to a fixed range removes the effect.</div>`:''}

<div class="panel" style="margin-top:14px">
<h3 style="margin-top:0">Closest flip</h3>
<p>${esc(ANALYSIS.closestFlipSentence(cf,model))}</p>
</div>

<div class="panel" style="margin-top:14px">
<h3 style="margin-top:0">Per-criterion flip thresholds</h3>
<p class="viewsub" style="margin-top:-6px">${esc(winner.label)} vs ${esc(runnerUp.label)}</p>
<ul>${flipRows}</ul>
</div>

<div class="panel" style="margin-top:14px">
<h3 style="margin-top:0">Input tolerances</h3>
<ul>${tolRows.join('')}</ul>
</div>

<div class="panel" style="margin-top:14px">
<h3 style="margin-top:0">Weight-agnostic win share</h3>
<p class="viewsub" style="margin-top:-6px">5000 random weight draws, unlocked criteria only.</p>
<button class="btn primary" id="runRobustnessBtn">Run</button>
${robustness?`<p style="margin-top:10px">${esc(ANALYSIS.robustnessSentence(robustness.shares,model))}</p>
<div class="weightbar" style="margin-top:8px">${model.options.map((o,i)=>{const pct=(robustness.shares[o.id]||0)*100;return pct>0.5?`<span style="width:${pct}%;background:${critColor(i)}" title="${esc(o.label)}: ${pct.toFixed(1)}%">${pct>=8?esc(o.label):''}</span>`:'';}).join('')}</div>`:''}
</div>

<div class="panel" style="margin-top:14px">
<h3 style="margin-top:0">Monte Carlo</h3>
<p class="viewsub" style="margin-top:-6px">Seed ${model.view.seed||1}. Default uncertainty is zero \u2014 off.</p>
<button class="btn" id="assumeUncBtn">Assume \u00b15% of column range</button>
<button class="btn primary" id="runMcBtn">Run Monte Carlo</button>
${mc?renderMcResults(model,mc):(model.criteria.some(c=>c.uncertainty.kind!=='none')?'':'<p class="viewsub" style="margin-top:8px">No uncertainty declared \u2014 Monte Carlo has nothing to sample.</p>')}
</div>`;
}
};

function assert(name,cond){results.push({name,pass:!!cond});}
function approx(a,b,eps=1e-6){return Math.abs(a-b)<=eps;}

function run(){
results.length=0;

const lin=NORMALIZERS.linear;
const statsAB={min:0,max:10,values:[0,5,10]};
assert('linear at min returns 0',approx(lin.fn(0,{},statsAB).v,0));
assert('linear at max returns 1',approx(lin.fn(10,{},statsAB).v,1));
assert('linear at midpoint returns 0.5',approx(lin.fn(5,{},statsAB).v,0.5));
assert('linear zero-variance returns 0.5 and flags',(()=>{
const r=lin.fn(3,{},{min:3,max:3,values:[3,3]});
return approx(r.v,0.5)&&!!r.flag;
})());

const fl=NORMALIZERS['fixed-linear'];
assert('fixed-linear at lo returns 0',approx(fl.fn(0,{lo:0,hi:10}).v,0));
assert('fixed-linear at hi returns 1',approx(fl.fn(10,{lo:0,hi:10}).v,1));
assert('fixed-linear clamps and flags out-of-range',(()=>{
const r=fl.fn(15,{lo:0,hi:10});
return approx(r.v,1)&&!!r.flag;
})());

const dec=NORMALIZERS.decay;
assert('decay at x=0 returns 1',approx(dec.fn(0,{halfLife:10}).v,1));
assert('decay at one half-life returns 0.5',approx(dec.fn(10,{halfLife:10}).v,0.5,1e-9));

const log_=NORMALIZERS.logistic;
assert('logistic at midpoint returns 0.5',approx(log_.fn(5,{midpoint:5,width:2}).v,0.5));

const tb=NORMALIZERS['target-band'];
assert('target-band at ideal returns 1',approx(tb.fn(5,{ideal:5,tol:2}).v,1));
assert('target-band at ideal+tol returns 0',approx(tb.fn(7,{ideal:5,tol:2}).v,0));

const ts=NORMALIZERS['target-soft'];
assert('target-soft at ideal returns 1',approx(ts.fn(5,{ideal:5,sigma:2}).v,1));

const stp=NORMALIZERS.step;
assert('step returns the correct band',(()=>{
const p={breakpoints:[{at:0,v:0},{at:10,v:0.5},{at:20,v:1}]};
return approx(stp.fn(12,p).v,0.5)&&approx(stp.fn(25,p).v,1)&&approx(stp.fn(-5,p).v,0);
})());

const ll=NORMALIZERS['log-linear'];
assert('log-linear at min returns 0',approx(ll.fn(1,{},{min:1,max:100,values:[1,10,100]}).v,0));
assert('log-linear at max returns 1',approx(ll.fn(100,{},{min:1,max:100,values:[1,10,100]}).v,1));
assert('log-linear with non-positive input raises a handled error',(()=>{
try{ll.fn(0,{},{min:1,max:100,values:[1,100]});return false;}
catch(e){return true;}
})());

const pct=NORMALIZERS.percentile;
assert('percentile of lowest value returns 0',approx(pct.fn(1,{},{values:[1,2,3,4]}).v,0));
assert('percentile of highest value returns 1',approx(pct.fn(4,{},{values:[1,2,3,4]}).v,1));
assert('percentile averages ranks for ties',approx(pct.fn(2,{},{values:[1,2,2,4]}).v,0.5));

const cat=NORMALIZERS.categorical;
assert('categorical maps a known label',approx(cat.fn('gold',{map:{gold:1,silver:.5}}).v,1));
assert('categorical flags an unmapped label',cat.fn('bronze',{map:{gold:1}}).v===null);

const boo=NORMALIZERS.boolean;
assert('boolean true is 1',approx(boo.fn(true).v,1));
assert('boolean false is 0',approx(boo.fn(false).v,0));

assert('every registered normalizer has non-empty latex/plain/sheet',
Object.values(NORMALIZERS).every(n=>{
const stats={min:1,max:10,values:[1,5,10]};
const p={lo:0,hi:1,halfLife:10,midpoint:0,width:1,ideal:0,tol:1,sigma:1,breakpoints:[{at:0,v:0}],map:{a:1}};
return!!n.latex(p,stats)&&!!n.plain(p,stats)&&!!n.sheet(p,stats,'A2');
})
);

criteria:[

{id:'b',label:'B',unit:'',description:'',direction:'max',scale:{kind:'fixed-linear',params:{lo:0,hi:10}},weight:30,locked:false,missing:'exclude-option',uncertainty:{kind:'none',value:0}},
{id:'c',label:'C',unit:'',description:'',direction:'max',scale:{kind:'fixed-linear',params:{lo:0,hi:10}},weight:20,locked:false,missing:'exclude-option',uncertainty:{kind:'none',value:0}}

assert('power-mean p=1 equals hand-computed weighted sum',(()=>{
const r=ENGINE.score(fixture3x3(1));
const x=r.ranked.find(s=>s.option.id==='x');
return approx(x.total,.5*100+.3*50+.2*0,1e-6);
})());

assert('power-mean p=0 equals the geometric mean',(()=>{
const r=ENGINE.score(fixture3x3(0));
const z=r.ranked.find(s=>s.option.id==='z');
const expect=Math.pow(.5,.5)*Math.pow(.5,.3)*Math.pow(.5,.2)*100;
return approx(z.total,expect,1e-4);
})());

assert('power-mean p=-5 approaches the minimum',(()=>{
const r=ENGINE.score(fixture3x3(-5));
const y=r.ranked.find(s=>s.option.id==='y');

model.criteria[0].direction='min';
const r=ENGINE.score(model);
const x=r.ranked.find(s=>s.option.id==='x');

assert('hard gate excludes the option',(()=>{

model.gates=[{id:'g',label:'prefer A>=1',severity:'soft',penalty:15,message:'soft fail',when:{t:'cmp',criterion:'a',op:'>=',value:1}}];

['worst','neutral','best','redistribute'].forEach(policy=>{
assert(`missing policy '${policy}' produces the stated value and one imputations entry`,(()=>{
const model=fixture3x3(1);
model.criteria[0].missing=policy;
model.options[0].values.a=null;
const r=ENGINE.score(model);
const entry=r.imputations.find(i=>i.optionId==='x'&&i.criterionId==='a'&&i.policy===policy);
if(!entry)return false;
if(policy==='worst')return entry.valueUsed===0;
if(policy==='neutral')return entry.valueUsed===0.5;
if(policy==='best')return entry.valueUsed===1;
return entry.valueUsed===null;
})());
});

assert('ANALYSIS.flipThresholdExact matches a brute-force sweep to two decimal places',(()=>{
const model=EXAMPLES.meridian,result=ENGINE.score(model);
const exact=ANALYSIS.flipThresholdExact(model,result,'distance_km',result.winner.id,result.runnerUp.id);
let prevSign=null,found=null;
for(let t=0;t<=100;t+=0.01){
const clone=deepClone(model);
const w0=clone.criteria.find(c=>c.id==='distance_km').weight,S0=100-w0;
const others=clone.criteria.filter(c=>c.id!=='distance_km');
others.forEach(c=>{c.weight=(100-t)*model.criteria.find(x=>x.id===c.id).weight/S0;});
clone.criteria.find(c=>c.id==='distance_km').weight=t;
const r=ENGINE.score(clone);
const a=r.ranked.find(s=>s.option.id===result.winner.id),b=r.ranked.find(s=>s.option.id===result.runnerUp.id);
const sign=Math.sign((a?a.total:-1)-(b?b.total:-1));
if(prevSign!==null&&sign!==0&&prevSign!==0&&sign!==prevSign){found=t;break;}
if(sign!==0)prevSign=sign;
}
return found!==null&&approx(exact.tStar,found,0.02);
})());

assert('EXPORT.spreadsheetCSV formula matches the app\u2019s own normalized value for one cell',(()=>{
const model=EXAMPLES.meridian,result=ENGINE.score(model);

const stats=result.stats.perCriterion.distance_km;

assert('EXPORT.spreadsheetCSV reproduces every ranked option\u2019s total to one decimal',(()=>{
const model=EXAMPLES.meridian,result=ENGINE.score(model);
const csv=EXPORT.spreadsheetCSV(model,result);
const lines=csv.split('\n');
const normHdrIdx=lines.findIndex((l,i)=>l.startsWith('Option,')&&i>0);
const weightsHdrIdx=lines.findIndex(l=>l.startsWith('# Weights'));
const weights=lines[weightsHdrIdx+1].split(',').slice(1).map(Number);
let ok=true,checked=0;
model.options.forEach(o=>{
const entry=result.ranked.find(s=>s.option.id===o.id);
if(!entry)return;
checked++;
let total=0;
model.criteria.forEach((c,ci)=>{
const stats=result.stats.perCriterion[c.id];
const norm=NORMALIZERS[c.scale.kind];
let v;
try{const r=norm.fn(o.values[c.id],c.scale.params||{},stats);v=(typeof r==='object')?r.v:r;}catch(e){v=0;}
if(v===null)v=0;
if(c.direction==='min'&&c.scale.kind!=='decay'&&c.scale.kind!=='target-band')v=1-v;
total+=v*weights[ci];
});
if(!approx(total,entry.total,0.05))ok=false;
});
return ok&&checked>0;
})());

function commitCellValue(model,r,c,text){
const opt=model.options[r];
if(c===-1){opt.label=text.trim()||opt.label;return;}
const cr=model.criteria[c];
const norm=NORMALIZERS[cr.scale.kind];
const t=text.trim();
if(t===''){opt.values[cr.id]=null;return;}
if(norm.needs==='numeric'){
const n=Number(t);
if(Number.isFinite(n))opt.values[cr.id]=n;
else{opt.values[cr.id]=null;toast('\u201c'+t+'\u201d is not a number \u2014 left blank.');}
}else if(norm.needs==='boolean'){
if(/^(true|1|yes)$/i.test(t))opt.values[cr.id]=true;
else if(/^(false|0|no)$/i.test(t))opt.values[cr.id]=false;
else{opt.values[cr.id]=null;toast('\u201c'+t+'\u201d is not true/false \u2014 left blank.');}
}else{
opt.values[cr.id]=t;
}
}
function moveAfterCommit(model,r,c,key,shift){
const maxC=model.criteria.length-1;
if(key==='Enter'){
const nr=r+1;
return nr<model.options.length?{r:nr,c}:null;
}
if(!shift){
if(c<maxC)return{r,c:c+1};
return(r+1<model.options.length)?{r:r+1,c:-1}:null;
}
if(c>-1)return{r,c:c-1};
return(r-1>=0)?{r:r-1,c:maxC}:null;
}

else if((b=e.target.closest('#themeBtn'))){

}
else if((b=e.target.closest('.cellbox'))&&b.id!=='cellEdit'){
const td=b.closest('td');
if(td&&td.dataset.r!==undefined){
STORE.actUI(ui=>{ui.editingCell=null;ui.selection={r:+td.dataset.r,c:+td.dataset.c};});
b.focus();
}
}
else if((b=e.target.closest('[data-act="addOption"]'))){
STORE.act('Add option',model=>{model.options.push({id:uid('opt'),label:'New option',tags:[],notes:'',values:{}});});
}
else if((b=e.target.closest('[data-act="addCriterion"]'))){
STORE.act('Add criterion',model=>{
model.criteria.push({id:uid('crit'),label:'New criterion',unit:'',description:'',direction:'max',
scale:{kind:'linear',params:{}},weight:0,locked:false,missing:'exclude-option',uncertainty:{kind:'none',value:0}});
});
}
else if((b=e.target.closest('[data-rowop]'))){
const r=+b.dataset.r,op=b.dataset.rowop;
STORE.act('Row: '+op,model=>{
if(op==='up'&&r>0){const o=model.options.splice(r,1)[0];model.options.splice(r-1,0,o);}
else if(op==='down'&&r<model.options.length-1){const o=model.options.splice(r,1)[0];model.options.splice(r+1,0,o);}
else if(op==='dup'){const o=deepClone(model.options[r]);o.id=uid('opt');o.label=o.label+' copy';model.options.splice(r+1,0,o);}
else if(op==='del'){model.options.splice(r,1);}
});
}
else if((b=e.target.closest('[data-colop]'))){
const c=+b.dataset.c,op=b.dataset.colop;
STORE.act('Column: '+op,model=>{
if(op==='dup'){
const src=model.criteria[c];const cr=deepClone(src);cr.id=uid('crit');cr.label=cr.label+' copy';
model.criteria.splice(c+1,0,cr);
model.options.forEach(o=>{o.values[cr.id]=o.values[src.id];});
}else if(op==='del'){
const removed=model.criteria.splice(c,1)[0];
model.options.forEach(o=>{delete o.values[removed.id];});

});

else if((b=e.target.closest('[data-rocop]'))){

else if((b=e.target.closest('#applyRocBtn'))){
STORE.act('Apply rank-order weights',model=>{
const w=WEIGHTS.rankOrderCentroid(STORE.ui.rocOrder);
model.criteria.forEach(c=>{if(w[c.id]!==undefined){c.weight=w[c.id];c.locked=false;}});
});
toast('Rank-order weights applied');
}
else if((b=e.target.closest('#ahpNext'))){
STORE.actUI(ui=>{ui.ahpIndex=(ui.ahpIndex||0)+1;});
}
else if((b=e.target.closest('#ahpBack'))){
STORE.actUI(ui=>{ui.ahpIndex=Math.max(0,(ui.ahpIndex||0)-1);});
}
else if((b=e.target.closest('#ahpRestart'))){
STORE.actUI(ui=>{ui.ahpIndex=0;ui.ahpJudgments={};});
}
else if((b=e.target.closest('[data-revisit]'))){
const[i,j]=b.dataset.revisit.split('-').map(Number);
const ids=STORE.model.criteria.map(c=>c.id);
const pairs=WEIGHTS.allPairs(ids);
const idx=pairs.findIndex(p=>p.i===i&&p.j===j);
STORE.actUI(ui=>{ui.ahpIndex=idx>=0?idx:0;});
}
else if((b=e.target.closest('#applyAhpBtn'))){
const ids=STORE.model.criteria.map(c=>c.id);
const pairs=WEIGHTS.allPairs(ids);
const judgments=pairs.map(p=>({i:p.i,j:p.j,ratio:WEIGHTS.sliderToRatio((STORE.ui.ahpJudgments||{})[p.i+'-'+p.j]||0)}));
const result=WEIGHTS.pairwiseResult(ids,judgments);
if(result.CR<=0.10){
STORE.act('Apply pairwise weights',model=>{
model.criteria.forEach(c=>{if(result.weights[c.id]!==undefined){c.weight=result.weights[c.id];c.locked=false;}});
});
toast('Pairwise weights applied');
}
}
else if((b=e.target.closest('#savePresetBtn'))){
const name=(typeof prompt==='function')?prompt('Name this preset:'):null;
if(name){
STORE.act('Save preset',model=>{
const weights={};model.criteria.forEach(c=>{weights[c.id]=c.weight;});
model.presets.push({name,weights});
});
toast('Preset saved \u2014 '+name);
}
}
else if((b=e.target.closest('[data-applypreset]'))){
const i=+b.dataset.applypreset;
STORE.act('Apply preset',model=>{
const p=model.presets[i];
if(p)model.criteria.forEach(c=>{if(p.weights[c.id]!==undefined){c.weight=p.weights[c.id];c.locked=false;}});
});
}
else if((b=e.target.closest('[data-delpreset]'))){
const i=+b.dataset.delpreset;
STORE.act('Delete preset',model=>{model.presets.splice(i,1);});
}
else if((b=e.target.closest('[data-toggleexpand]'))){
const id=b.dataset.toggleexpand;
STORE.actUI(ui=>{
if(!ui.rankExpanded)ui.rankExpanded={};
ui.rankExpanded[id]=!ui.rankExpanded[id];
});
}
else if((b=e.target.closest('[data-pin]'))){
const id=b.dataset.pin;
STORE.act('Pin option',model=>{
if(!model.view.pinned)model.view.pinned=[];
const idx=model.view.pinned.indexOf(id);
if(idx>=0)model.view.pinned.splice(idx,1);
else{
model.view.pinned.push(id);
if(model.view.pinned.length>2)model.view.pinned.shift();
}
});
}
else if((b=e.target.closest('#runRobustnessBtn'))){
STORE.actUI(ui=>{ui.robustnessResult=ANALYSIS.weightAgnosticRobustness(STORE.model);});
}
else if((b=e.target.closest('#assumeUncBtn'))){
STORE.act('Assume \u00b15% uncertainty',model=>{model.criteria.forEach(c=>{c.uncertainty={kind:'pct',value:5};});});
STORE.actUI(ui=>{ui.mcAssumed=true;});
}
else if((b=e.target.closest('#runMcBtn'))){
STORE.actUI(ui=>{ui.monteCarloResult=ANALYSIS.monteCarlo(STORE.model);});
}
else if((b=e.target.closest('#copyRecordBtn'))){
const model=STORE.model,result=ENGINE.score(model);
const cf=ANALYSIS.closestFlip(model,result),robustness=STORE.ui.robustnessResult;
const md=EXPORT.decisionRecordMarkdown(model,result,{closestFlip:ANALYSIS.closestFlipSentence(cf,model),robustness:robustness?ANALYSIS.robustnessSentence(robustness.shares,model):null});
copyText(md).then(()=>toast('Decision record copied')).catch(()=>toast('Copy failed.'));
}
else if((b=e.target.closest('#printRecordBtn'))){
if(typeof window!=='undefined'&&window.print)window.print();
}
else if((b=e.target.closest('#downloadModelBtn'))){
download((STORE.model.meta.id||'model')+'.json',EXPORT.modelJSON(STORE.model),'application/json');
}
else if((b=e.target.closest('#downloadSheetBtn'))){
const result=ENGINE.score(STORE.model);
download((STORE.model.meta.id||'model')+'-spreadsheet.csv',EXPORT.spreadsheetCSV(STORE.model,result),'text/csv');
}
else if((b=e.target.closest('#copyJsonBtn'))){
copyText(EXPORT.modelJSON(STORE.model)).then(()=>toast('Model JSON copied')).catch(()=>toast('Copy failed.'));
}
});

document.addEventListener('change',e=>{
if(e.target.id==='importModelInput'){
const file=e.target.files&&e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const parsed=JSON.parse(reader.result);
if(!parsed||!Array.isArray(parsed.criteria)||!Array.isArray(parsed.options))throw new Error('bad shape');
STORE.loadModel(parsed);
toast('Model imported \u2014 '+(parsed.meta&&parsed.meta.name?parsed.meta.name:'untitled'));
}catch(err){toast('Could not read that file as a model.');}
};
reader.readAsText(file);
e.target.value='';
return;
}
if(e.target.id==='exampleSel'){
const key=e.target.value;
if(key&&EXAMPLES[key]){STORE.loadModel(EXAMPLES[key]);toast('Loaded '+EXAMPLES[key].meta.name);}
e.target.value='';
return;
}
if(e.target.matches('[data-pc][data-pf="type"]')){
pendingPaste.detect[+e.target.dataset.pc].type=e.target.value;
return;
}
const critField=e.target.closest('[data-crit][data-field]');
if(critField){
const id=critField.dataset.crit,field=critField.dataset.field;
STORE.act('Edit '+field,model=>{
const cr=model.criteria.find(c=>c.id===id);
if(field==='normalizer'){cr.scale={kind:critField.value,params:defaultParams(critField.value)};}
else if(field==='missing'){cr.missing=critField.value;}
else if(field==='uncKind'){cr.uncertainty.kind=critField.value;}
else if(field==='uncValue'){cr.uncertainty.value=Number(critField.value)||0;}
else if(field==='label'){cr.label=critField.value;}
else if(field==='unit'){cr.unit=critField.value;}
else if(field==='description'){cr.description=critField.value;}
});
return;
}
const paramField=e.target.closest('[data-crit][data-param]');
if(paramField){
const id=paramField.dataset.crit,key=paramField.dataset.param;
STORE.act('Edit parameter',model=>{
const cr=model.criteria.find(c=>c.id===id);
if(!cr.scale.params)cr.scale.params={};
if(key==='breakpoints'){
cr.scale.params.breakpoints=paramField.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
const parts=l.split(':');return{at:Number(parts[0]),v:Number(parts[1])};
}).filter(bp=>Number.isFinite(bp.at)&&Number.isFinite(bp.v));
}else if(key==='map'){
const map={};
paramField.value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
const idx=l.lastIndexOf(':');
if(idx>0){const k=l.slice(0,idx).trim(),v=Number(l.slice(idx+1).trim());if(k&&Number.isFinite(v))map[k]=v;}
});
cr.scale.params.map=map;
}else{
cr.scale.params[key]=Number(paramField.value);
}
});
return;
}
const directCtl=e.target.closest('[data-directid],[data-directnum]');
if(directCtl){
const id=directCtl.dataset.directid||directCtl.dataset.directnum;
const value=Number(directCtl.value);
const res=WEIGHTS.applyDirect(STORE.model.criteria,id,value);
if(res.ok){
STORE.act('Set weight',model=>{
model.criteria.forEach(c=>{if(res.weights[c.id]!==undefined)c.weight=res.weights[c.id];});
});
}else{
toast(res.reason);
VIEWS.weights.render();
}
}
});

document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&$('#pasteModalBg')){VIEWS.data.closeModal();return;}
const editInput=e.target.closest&&e.target.closest('#cellEdit');
if(editInput){
const td=editInput.closest('td');
const r=+td.dataset.r,c=+td.dataset.c;
if(e.key==='Enter'||e.key==='Tab'){
e.preventDefault();
const val=editInput.value;
STORE.act('Edit cell',model=>{commitCellValue(model,r,c,val);});
const nxt=moveAfterCommit(STORE.model,r,c,e.key,e.shiftKey);
STORE.actUI(ui=>{ui.editingCell=nxt;});
}else if(e.key==='Escape'){
e.preventDefault();
STORE.actUI(ui=>{ui.editingCell=null;});
}
return;
}
const box=e.target.closest&&e.target.closest('.cellbox');
if(box&&box.id!=='cellEdit'){
const td=box.closest('td');
if(td&&td.dataset.r!==undefined&&/^Arrow(Up|Down|Left|Right)$/.test(e.key)){
const r=+td.dataset.r,c=+td.dataset.c,maxC=STORE.model.criteria.length-1;
let nr=r,nc=c;
if(e.key==='ArrowUp')nr=Math.max(0,r-1);
else if(e.key==='ArrowDown')nr=Math.min(STORE.model.options.length-1,r+1);
else if(e.key==='ArrowLeft')nc=Math.max(-1,c-1);
else if(e.key==='ArrowRight')nc=Math.min(maxC,c+1);
e.preventDefault();
const sel=$('td[data-r="'+nr+'"][data-c="'+nc+'"] .cellbox');
if(sel)sel.focus();
return;
}
if(td&&td.dataset.r!==undefined&&e.key==='Enter'){
e.preventDefault();
STORE.actUI(ui=>{ui.editingCell={r:+td.dataset.r,c:+td.dataset.c};});
}
return;
}
const tag=(e.target.tagName||'').toLowerCase();
const typing=tag==='input'||tag==='textarea'||tag==='select';
if((e.ctrlKey||e.metaKey)&&!typing){
if(e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();STORE.undo();return;}
if((e.key.toLowerCase()==='z'&&e.shiftKey)||e.key.toLowerCase()==='y'){e.preventDefault();STORE.redo();return;}
}
if(!typing&&/^[1-6]$/.test(e.key)){
const views=['data','criteria','weights','rank','stress','record'];
STORE.actUI(ui=>{ui.activeView=views[+e.key-1];});
}
});

document.addEventListener('paste',e=>{
if(!e.target.closest||!e.target.closest('#gridPasteTarget'))return;
e.preventDefault();
const text=(e.clipboardData||window.clipboardData).getData('text/plain');
VIEWS.data.handlePaste(text);
});

document.addEventListener('input',e=>{
if(e.target.id==='ahpSlider'){
const i=+e.target.dataset.i,j=+e.target.dataset.j,s=+e.target.value;
if(!STORE.ui.ahpJudgments)STORE.ui.ahpJudgments={};
STORE.ui.ahpJudgments[i+'-'+j]=s;
const lbl=$('#ahpSliderLabel');
if(lbl)lbl.textContent=ahpSliderText(s);
}
});
}

function init(){
try{const th=localStorage.getItem('rubric.theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
populateExampleSelect();
STORE.subscribe(renderAll);
wireEvents();
STORE.load();
if(typeof location!=='undefined'&&/[?&]test=1\b/.test(location.search)){
TESTS.run();
}
}
if(typeof document!=='undefined'){
if(document.readyState!=='loading')init();
else document.addEventListener('DOMContentLoaded',init);
}

if(typeof module!=='undefined')module.exports={NORMALIZERS,ENGINE,EXAMPLES,TESTS,STORE,VIEWS,WEIGHTS,ANALYSIS,EXPORT,evalCondition,isMissingVal,sum,clamp,fmt,deepClone,parseTable,inferColType,commitCellValue,init};

</script>
</body>
</html>
